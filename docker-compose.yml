services:
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app
      - /app/node_modules

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./back:/app
    environment:
      - APP_ENV=development # development モード時のログ制御のために設定

      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=yara0809
      - DB_NAME=SWKDB
    depends_on:
      - database

  database:
    image: postgres:17-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data # pgdata：Dockerが管理する名前付きボリューム
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=yara0809
      - POSTGRES_DB=SWKDB

volumes:
  pgdata:
